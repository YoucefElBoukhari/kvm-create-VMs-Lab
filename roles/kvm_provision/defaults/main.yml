---
# defaults file for kvm_provision

# --- Configuration Globale (Commune à toutes les VMs) ---
base_image_name: noble-server-cloudimg-amd64.img
base_image_url: https://cloud-images.ubuntu.com/noble/current/{{ base_image_name }}
libvirt_pool_dir: "/var/lib/libvirt/images"
vm_root_pass: "123456789"
ssh_key: "/root/.ssh/id_rsa.pub"  # Assurez-vous que cette clé existe sur l'hôte !

# --- Définition des 3 VMs (Architecture Lab) ---
guests:
  # 1. BASTION (Gateway + Deployer)
  # Rôle : Accès SSH et exécution de Kolla-Ansible
  - name: bastion
    memory: 4096       # 4 Go
    vcpus: 1
    disk_size: 40G     # Espace pour les images Docker en cache
    interfaces:
      - network: default             # eth0: Vers Internet (Bridge Hôte)
      - network: management-network  # eth1: Vers le Cluster (10.10.10.x)

  # 2. CONTROLLER (Cerveau)
  # Rôle : API, DB, RabbitMQ, Horizon
  - name: controller
    memory: 8192       # 8 Go
    vcpus: 4
    disk_size: 50G
    interfaces:
      - network: management-network  # eth0: API & Trafic Interne
      - network: provider-network    # eth1: Neutre (Pas d'IP, pour Neutron/Calico)

  # 3. COMPUTE (Muscles)
  # Rôle : Héberge les VMs CirrOS
  - name: compute
    memory: 6144       # 6 Go
    vcpus: 4
    disk_size: 60G
    interfaces:
      - network: management-network  # eth0: Tunnel & Management
      - network: provider-network    # eth1: Sortie directe (Pas d'IP)
